# Build APK otomatis di server GitHub (tanpa laptop).
# Urutan: build release (R8) → tes unit → tangkapan layar → lint → build debug → pembanding release/debug. Hasilnya:
#  - APK release (R8 + penyusutan resource + Baseline Profile) = TVLauncher.apk; APK debug = TVLauncher-debug.apk (cadangan)
#    → tab Actions → run terbaru → Artifacts, atau halaman Releases (tag "latest")
#  - Laporan tes & lint: artifact "VinylLauncher-reports"; pemetaan nama R8: artifact "TVLauncher-r8-mapping"
#  - Gagal? log lengkap disimpan di branch "build-log" (berkas build.log)
#
# Kunci tanda tangan: isi GitHub Secrets (Settings → Secrets and variables → Actions) agar setiap APK
# ditandatangani kunci rahasia yang sama. Tanpa itu, APK debug memakai kunci debug acak per build (tidak bisa
# saling menimpa saat dipasang). Sidik jari sertifikat APK dicetak di log & ringkasan run. Langkah lengkap: SECURITY.md.
#   VINYL_KEYSTORE_BASE64   isi berkas keystore dalam base64
#   VINYL_KEYSTORE_PASSWORD password keystore
#   VINYL_KEY_ALIAS         (opsional) alias kunci, default "vinyl"
#   VINYL_KEY_PASSWORD      (opsional) password kunci, default sama dengan password keystore
name: Build APK

on:
  push:
    # main: build + rilis "latest". retro-tv: branch kerja tema TV tabung — build, tes, lint, dan tangkapan layar,
    # TANPA menerbitkan rilis (APK setengah jadi tidak boleh menimpa unduhan publik). ruang-hidup: branch kerja fitur
    # ruangan (tema era, radio, jam, telepon, poster, buku harian, piala), aturannya sama dengan retro-tv.
    branches: [main, retro-tv, ruang-hidup]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      # Runner GitHub sudah berisi Android SDK; pastikan platform 36 & build-tools tersedia
      - name: Siapkan Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_B64: ${{ secrets.VINYL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VINYL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VINYL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VINYL_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vinyl.jks"
            echo "VINYL_KEYSTORE_FILE=$RUNNER_TEMP/vinyl.jks" >> "$GITHUB_ENV"
            echo "VINYL_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            if [ -n "$KEY_ALIAS" ]; then echo "VINYL_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"; fi
            if [ -n "$KEY_PASSWORD" ]; then echo "VINYL_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"; fi
            echo "Kunci tanda tangan rahasia dari Secrets dipakai." >> "$GITHUB_STEP_SUMMARY"
          elif [ -f app/vinyl.keystore ]; then
            echo "::warning title=Kunci tanda tangan publik::Secrets VINYL_KEYSTORE_* belum diisi; APK ditandatangani dengan kunci lama yang ada di repo (publik). Lihat SECURITY.md."
            echo "⚠️ APK ditandatangani dengan kunci lama yang publik. Isi Secrets VINYL_KEYSTORE_* (lihat SECURITY.md)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Tanpa kunci rahasia::Secrets VINYL_KEYSTORE_* belum diisi dan repo ini tidak menyimpan kunci; APK debug memakai kunci debug bawaan Android, jadi tidak bisa menimpa aplikasi yang ditandatangani kunci lain. Lihat SECURITY.md."
            echo "ℹ️ APK debug memakai kunci debug bawaan (tanpa kunci rahasia). Isi Secrets VINYL_KEYSTORE_* agar pembaruan antar-build bisa saling menimpa (lihat SECURITY.md)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Build release (R8 + penyusutan resource + Baseline Profile) dikerjakan PERTAMA supaya kegagalan R8 muncul cepat.
      # APK inilah yang diterbitkan; APK debug tetap dibuat di bawah sebagai cadangan. Fakta APK (izin, sertifikat,
      # bisa-di-debug, profil dasar) dicetak sebagai bukti.
      - name: Build release APK (R8)
        run: |
          chmod +x gradlew .github/scripts/*.sh
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log
          REL=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          .github/scripts/apk_facts.sh release "$REL" 2>&1 | tee -a build.log
          # Pemetaan nama R8 dipakai membaca ulang jejak tumpukan; juga dicatat ukurannya
          ls -l app/build/outputs/mapping/release/ 2>&1 | tee -a build.log || true

      - name: Tes unit
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee -a build.log

      # Tangkapan layar Compose tanpa HP (Roborazzi + Robolectric). PNG disalin ke branch log agar bisa diperiksa.
      # Belum memblokir: kegagalan infrastruktur render tidak boleh menahan build selama tahap awal.
      - name: Tangkapan layar
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew recordRoborazziDebug --stacktrace --no-daemon 2>&1 | tee -a build.log

      # Lint memblokir bila ada ERROR (build #3: 0 error). Peringatan tetap dilaporkan di build.log, tidak memblokir.
      - name: Lint
        run: |
          set -o pipefail
          ./gradlew lintDebug --stacktrace --no-daemon 2>&1 | tee -a build.log

      # Laporan lint teks ikut ke build.log supaya bisa dibaca lewat branch "build-log" (log Actions tidak selalu terbuka)
      - name: Sertakan laporan lint
        if: always()
        run: |
          for f in app/build/reports/lint-results-debug.txt; do
            if [ -f "$f" ]; then { echo; echo "===== LAPORAN LINT ($f) ====="; cat "$f"; } >> build.log; fi
          done

      # Build ini hanya mencatat tes yang GAGAL. Langkah ini membaca laporan XML dan mencetak jumlah tes yang sungguh
      # berjalan (per kelas) ke build.log, supaya "tes lulus" punya angka sebagai bukti. Tidak pernah menggagalkan build.
      - name: Ringkas hasil tes unit
        if: always()
        run: python3 .github/scripts/test_summary.py app/build/test-results 2>&1 | tee -a build.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee -a build.log
          # Izin di APK sebenarnya (manifest gabungan, termasuk yang dibawa library) dicatat agar bisa diperiksa
          M=$(find app/build/intermediates -path '*debug*' -name AndroidManifest.xml -path '*merged_manifest*' | head -1)
          # Elemen dengan beberapa atribut ditulis multi-baris di manifest gabungan, jadi baris digabung dulu sebelum dicari
          { echo; echo "===== IZIN DI APK (manifest gabungan: $M) ====="
            tr '\n' ' ' < "$M" | grep -o '<uses-permission[^>]*>' | while read -r e; do
              n=$(echo "$e" | grep -o 'android:name="[^"]*"' | cut -d'"' -f2)
              # grep tanpa hasil = status 1; dengan bash -e + pipefail itu menghentikan langkah, jadi diabaikan
              m=$(echo "$e" | grep -o 'android:maxSdkVersion="[^"]*"' | cut -d'"' -f2 || true)
              echo "$n${m:+ (hanya s.d. API $m)}"
            done | sort; } | tee -a build.log
          # Sidik jari sertifikat penanda tangan APK: harus sama di setiap build agar pembaruan bisa menimpa
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          SIGNER=$(ls "${ANDROID_HOME:-/nonexistent}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          FP=""
          if [ -n "$APK" ] && [ -x "$SIGNER" ]; then
            # Format sama dengan keytool (huruf besar, dipisah titik dua) agar mudah dicocokkan
            FP=$("$SIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | sed 's/.*digest: //' \
              | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//' || true)
          fi
          { echo; echo "===== SERTIFIKAT APK (SHA-256) ====="; echo "${FP:-tidak terbaca}"; } | tee -a build.log
          echo "Sertifikat APK (SHA-256): \`${FP:-tidak terbaca}\`" >> "$GITHUB_STEP_SUMMARY"

      # Release harus memakai tanda tangan DAN izin yang sama dengan debug: tanda tangan berbeda berarti tidak bisa
      # menimpa pemasangan lama, izin berbeda berarti ada yang berubah diam-diam. Keduanya menggagalkan langkah ini.
      - name: Bandingkan release dengan debug
        run: |
          DBG=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          .github/scripts/apk_facts.sh debug "$DBG" 2>&1 | tee -a build.log
          log() { echo "$@" | tee -a build.log; }
          bad=0
          log; log "===== PERBANDINGAN RELEASE vs DEBUG ====="
          if diff -u app/build/facts/debug.perm app/build/facts/release.perm > app/build/facts/perm.diff; then
            log "izin: sama persis ($(wc -l < app/build/facts/release.perm) izin)"
          else
            tee -a build.log < app/build/facts/perm.diff
            log "izin: BERBEDA (selisih di atas)"; bad=1
          fi
          RFP=$(cat app/build/facts/release.fp); DFP=$(cat app/build/facts/debug.fp)
          if [ -n "$RFP" ] && [ "$RFP" = "$DFP" ]; then
            log "sertifikat: sama ($RFP)"
          else
            log "sertifikat: BERBEDA atau tidak terbaca (release=$RFP debug=$DFP)"; bad=1
          fi
          log "ukuran: release $(cat app/build/facts/release.size) bita, debug $(cat app/build/facts/debug.size) bita"
          {
            echo "### APK release"
            echo "- ukuran: $(cat app/build/facts/release.size) bita (debug: $(cat app/build/facts/debug.size) bita)"
            echo "- sertifikat release: \`$(cat app/build/facts/release.fp)\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $bad

      # Nama berkas akhir: TVLauncher.apk = release (R8), TVLauncher-debug.apk = debug (cadangan)
      - name: Kemas APK
        run: |
          mkdir -p dist
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -1)" dist/TVLauncher.apk
          cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -1)" dist/TVLauncher-debug.apk
          ls -l dist

      # Uji asap di emulator Android 15: pasang dan jalankan APK RELEASE (hasil R8), putar layar, geser halaman, laci,
      # game, film, matikan proses lalu buka lagi, baca logcat. Lihat .github/scripts/smoke_test.sh. Emulator dirender
      # perangkat lunak, jadi ini bukan pengganti uji di perangkat nyata. Gangguan emulator sendiri (gagal booting)
      # tidak menggagalkan job; yang menentukan adalah langkah "Nilai uji asap" di bawahnya.
      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Uji asap di emulator
        id: smoke
        continue-on-error: true
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash .github/scripts/smoke_test.sh dist/TVLauncher.apk dist/TVLauncher-debug.apk smoke-out

      # PASS = lanjut; FAIL (crash, ANR, tanda R8 rusak, pengaturan hilang setelah proses dimatikan) = job gagal dan rilis
      # TIDAK diterbitkan; INCONCLUSIVE (emulator tidak sempat menjalankan skrip) = peringatan, rilis tetap boleh.
      - name: Nilai uji asap
        id: smoke_verdict
        if: always()
        run: |
          first=$(head -1 smoke-out/result.txt 2>/dev/null || echo "TIDAK-ADA")
          case "$first" in
            PASS*) v=pass ;;
            FAIL*) v=fail ;;
            *) v=inconclusive ;;
          esac
          echo "verdict=$v" >> "$GITHUB_OUTPUT"
          {
            echo "### Uji asap emulator: $v"
            echo '```'
            if [ -f smoke-out/result.txt ]; then cat smoke-out/result.txt; else echo "result.txt tidak ada (emulator tidak sempat menjalankan skrip)"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo; echo "===== UJI ASAP EMULATOR: $v ====="
            cat smoke-out/result.txt 2>/dev/null || echo "result.txt tidak ada"
            echo "--- log.txt ---"
            cat smoke-out/log.txt 2>/dev/null || true
          } >> build.log
          if [ "$v" = "fail" ]; then echo "::error title=Uji asap gagal::$first"; exit 1; fi
          if [ "$v" = "inconclusive" ]; then echo "::warning title=Uji asap tidak konklusif::$first"; fi

      - name: Ringkas peringatan kompiler
        if: always()
        run: |
          n=$(grep -c '^w: ' build.log 2>/dev/null || true)
          r8=$(grep -ciE 'warning: .*R8|^R8: |Missing class' build.log 2>/dev/null || true)
          {
            echo "### Peringatan kompiler Kotlin: ${n:-0}"
            if [ "${n:-0}" != "0" ]; then
              echo '```'
              grep '^w: ' build.log | sort -u | head -60
              echo '```'
            fi
            echo "### Peringatan R8: ${r8:-0}"
            if [ "${r8:-0}" != "0" ]; then
              echo '```'
              grep -iE 'warning: .*R8|^R8: |Missing class' build.log | sort -u | head -40
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: VinylLauncher-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/
            app/build/test-results/

      # Simpan log (juga saat sukses, karena lint tidak memblokir) ke branch "build-log" agar mudah dibaca
      - name: Simpan log
        if: always()
        run: |
          mkdir -p /tmp/log && cp build.log /tmp/log/build.log || echo "build.log tidak ada" > /tmp/log/build.log
          if [ -d app/build/outputs/roborazzi ]; then mkdir -p /tmp/log/shots && cp -r app/build/outputs/roborazzi/. /tmp/log/shots/; fi
          if [ -d smoke-out ]; then
            mkdir -p /tmp/log/smoke && cp -r smoke-out/. /tmp/log/smoke/
            gzip -9 /tmp/log/smoke/logcat_*.txt 2>/dev/null || true
          fi
          # main → branch "build-log"; branch lain → "build-log-<nama branch>"
          LOGBR=build-log; [ "${GITHUB_REF_NAME}" != "main" ] && LOGBR="build-log-${GITHUB_REF_NAME}"
          cd /tmp/log
          git init -q && git checkout -q -b "$LOGBR"
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "log ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$LOGBR"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: TVLauncher-apk
          if-no-files-found: ignore
          path: dist/*.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: TVLauncher-smoke
          if-no-files-found: ignore
          path: smoke-out/

      # Pemetaan nama R8: tanpa ini jejak tumpukan dari APK release tidak bisa dibaca
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: TVLauncher-r8-mapping
          if-no-files-found: warn
          path: app/build/outputs/mapping/release/

      # APK juga dipasang di halaman Releases supaya bisa diunduh langsung dari tablet tanpa login
      - name: Terbitkan rilis "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE: ${{ steps.smoke_verdict.outputs.verdict }}
        run: |
          # TVLauncher.apk = release; VinylLauncher.apk (berkas yang sama) agar tautan lama tetap berfungsi;
          # TVLauncher-debug.apk = cadangan bila build release bermasalah di perangkat (ditandatangani kunci yang sama)
          cp dist/TVLauncher.apk TVLauncher.apk
          cp dist/TVLauncher.apk VinylLauncher.apk
          cp dist/TVLauncher-debug.apk TVLauncher-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TVLauncher.apk VinylLauncher.apk TVLauncher-debug.apk \
            --title "TV Launcher (build terbaru)" \
            --notes "APK release (R8 + Baseline Profile) dari commit ${GITHUB_SHA::7}. Uji asap emulator Android 15: ${SMOKE}. TVLauncher-debug.apk = APK debug cadangan (lebih besar dan lebih lambat), ditandatangani kunci yang sama."
